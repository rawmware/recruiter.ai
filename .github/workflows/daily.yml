name: Daily refresh and deploy
on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', 'scripts/**', '.github/workflows/daily.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: recruiter-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests first
        run: npm run test:pipeline
      - name: Fetch and analyze today's postings
        if: github.event_name != 'push'
        run: npm run data
      - name: Commit the new snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "recruiter-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no data change"; else
            git commit -m "data: refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Generate build log from git history
        run: npm run buildlog
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
